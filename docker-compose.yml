# Build the warehouse first on the host (make all) or inside the image:
#   docker compose run --rm api uv run --no-sync python -m assetlens.warehouse.build   (needs data/raw cache + .env)
services:
  api:
    build: .
    image: assetlens:latest
    ports: ["8000:8000"]
    env_file: [.env]
    volumes: ["./data:/app/data", "./outputs:/app/outputs"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/docs')"]
      interval: 30s
      timeout: 10s
      retries: 5
  app:
    image: assetlens:latest
    command: ["uv", "run", "--no-sync", "streamlit", "run", "app/streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true"]
    ports: ["8501:8501"]
    env_file: [.env]
    volumes: ["./data:/app/data:ro", "./outputs:/app/outputs:ro"]
    depends_on: [api]
