[project]
name = "assetlens"
version = "0.1.0"
description = "Asset manager benchmarking, profitability and FP&A platform"
requires-python = ">=3.11"
dependencies = [
  "httpx",
  "tenacity",
  "beautifulsoup4",
  "lxml",
  "pandas",
  "numpy",
  "scipy",
  "statsmodels",
  "pydantic>=2",
  "pandera",
  "duckdb",
  "pyyaml",
  "python-dotenv",
  "openpyxl",
  "python-pptx",
  "matplotlib",
  "numpy-financial",
  "pyarrow",
  "formulas>=1.3.4",
  "fastapi>=0.156.8",
  "uvicorn>=0.54.0",
  "streamlit>=1.66.0",
  "scikit-learn>=1.9.1",
  "ortools>=9.15.6755",
  "mlflow>=3.17.2",
  "plotly>=7.1.0",
  "langgraph>=1.2.16",
  "sqlglot>=30.24.0",
  "rank-bm25>=0.2.2",
  "anthropic>=1.17.0",
]
[project.optional-dependencies]
dev = ["pytest", "hypothesis", "ruff", "mypy", "pytest-cov", "dbt-duckdb"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/assetlens"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: recalculates the Excel workbook (about 80 s)"]
[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "dbt-duckdb>=1.11.0",
]

[tool.ruff.lint]
ignore = ["E501", "E701", "E702", "E731", "E741", "C408", "ISC004", "UP031", "BLE001", "RUF034", "RUF007", "PERF102", "S110", "RUF046", "RUF015", "FURB167"]
