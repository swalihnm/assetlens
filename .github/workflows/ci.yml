name: ci
on:
  push: {branches: [main]}
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with: {enable-cache: true}
      - run: uv python install 3.12
      - run: uv sync --all-extras
      - name: Lint
        run: uv run ruff check src tests
      - name: Tests (unit and property tests; warehouse-dependent tests skip without the SEC cache)
        run: uv run pytest -q -m "not slow"
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t assetlens:ci .
